spring:
  datasource:
    url: "${DEVLOG_DB_URL:jdbc:mysql://localhost:3306/devlog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: "${DEVLOG_DB_USERNAME:root}"
    password: "${DEVLOG_DB_PASSWORD:}"
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

