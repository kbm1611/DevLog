spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:devlog-test;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
